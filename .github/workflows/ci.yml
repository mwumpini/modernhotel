name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Production build
        run: npm run build
        env:
          NEXTAUTH_SECRET: ci-build-secret
          DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/ci

      - name: Regression scripts
        run: |
          npx tsx scripts/test-fo-night-audit.ts
          npx tsx scripts/test-accounting-process.ts
          npx tsx scripts/test-bank-recon-calculations.ts
