name: CI

# Runs on every push to main (each push is also a live deploy) and on pull requests.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Unit tests (taxes, bills, numbering, dates)
        run: npm test

      - name: Regression scripts (night audit, accounting, bank reconciliation)
        run: npm run test:regression

      - name: Production build
        run: npm run build
        env:
          NEXTAUTH_SECRET: ci-build-secret
          DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/ci
